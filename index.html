<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALA公司品牌治理看板｜单文件版</title>
  <link rel="icon" href="data:,">
  <style>
:root {
  --navy: #12384d;
  --navy-2: #0e2d3f;
  --ink: #183043;
  --muted: #6d7f8a;
  --line: #dce5ea;
  --soft: #f4f7f9;
  --white: #fff;
  --green: #2e9d63;
  --yellow: #e8a522;
  --red: #d84a45;
  --blue: #2e72c9;
  --brand: #168c46;
  --product: #2f72c9;
  --ads: #7257c7;
  --service: #e87912;
  --collection: #a88736;
  --risk: #b26235;
  --legal: #686f7a;
  --data: #2877a9;
  --shadow: 0 12px 32px rgba(18,56,77,.075);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; color: var(--ink); background: var(--soft); }
button, select, input { font: inherit; }
button { cursor: pointer; }

.demo-strip { height: 30px; display: grid; place-items: center; background: #fff4d9; color: #8a5d00; font-size: 12px; font-weight: 700; letter-spacing: .2px; }
.app-header { height: 92px; display: flex; justify-content: space-between; align-items: center; padding: 0 44px; background: #fff; border-bottom: 1px solid var(--line); }
.brand-block { display: flex; align-items: center; gap: 15px; }
.app-logo { width: 52px; height: 52px; object-fit: contain; border-radius: 13px; box-shadow: 0 5px 14px rgba(47,74,255,.18); }
.brand-copy { display: flex; min-width: 330px; flex-direction: column; justify-content: center; }
.brand-block h1 { margin: 0; font-size: 27px; line-height: 1.1; }
.brand-period { display: flex; align-items: center; gap: 7px; margin: 7px 0 0; color: var(--muted); font-size: 12px; }
.brand-period span { color: var(--muted); }
.brand-period strong { color: var(--ink); font-size: 12px; }
.header-actions { display: flex; align-items: flex-end; gap: 14px; }
.period-switch { display: flex; height: 44px; padding: 3px; background: var(--soft); border: 1px solid var(--line); }
.period-switch button { min-width: 52px; height: 36px; border: 0; padding: 0 16px; background: transparent; color: var(--muted); }
.period-switch button.active { background: var(--navy); color: #fff; font-weight: 800; }
.period-selector { display: flex; min-width: 300px; flex-direction: column; gap: 4px; }
.period-selector small, .update-info small { color: var(--muted); font-size: 11px; }
.period-selector select { width: 100%; height: 44px; padding: 0 34px 0 12px; border: 1px solid var(--line); background: #fff; color: var(--ink); font-size: 12px; font-weight: 700; }
.outline-button { height: 44px; border: 1px solid var(--navy); background: #fff; color: var(--navy); padding: 0 18px; font-weight: 800; white-space: nowrap; }
.outline-button:hover { background: var(--soft); }

.department-tabs { position: sticky; top: 0; z-index: 10; display: flex; align-items: stretch; gap: 0; padding: 0 44px; background: #fff; border-bottom: 1px solid var(--line); overflow-x: auto; box-shadow: 0 4px 15px rgba(18,56,77,.035); }
.department-tab { flex: 0 0 auto; min-width: 120px; border: 0; border-bottom: 4px solid transparent; background: transparent; padding: 17px 15px 14px; color: var(--muted); font-size: 13px; font-weight: 700; }
.department-tab:hover { color: var(--ink); background: var(--soft); }
.department-tab.active { color: var(--tab-color); border-bottom-color: var(--tab-color); background: color-mix(in srgb, var(--tab-color) 6%, white); }

#dashboardRoot { max-width: 1800px; margin: 0 auto; padding: 26px 44px 60px; }
.section-label { margin: 0 0 5px; color: var(--blue); font-size: 11px; font-weight: 800; letter-spacing: 1.5px; }
.section-title { margin: 0; font-size: 21px; }
.section-note { margin: 0; color: var(--muted); font-size: 13px; }
.section-head { display: flex; justify-content: space-between; align-items: end; margin-bottom: 13px; }

.overview-hero { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 144px; background: var(--navy); color: #fff; box-shadow: var(--shadow); }
.overall-score { display: flex; flex-direction: column; justify-content: center; align-items: center; border-right: 1px solid rgba(255,255,255,.17); }
.overall-score small { color: #b9cbd5; }
.overall-score strong { margin: 4px 0; font-size: 45px; line-height: 1; }
.overall-score span { color: #ffd37b; font-weight: 800; }
.hero-message { align-self: center; padding: 25px 34px; }
.hero-message small { color: #b9cbd5; }
.hero-message h2 { margin: 8px 0 10px; font-size: 25px; line-height: 1.35; }
.hero-message p { margin: 0; color: #b9cbd5; font-size: 13px; }
.metric-section { margin-top: 24px; }
.metric-grid { display: grid; grid-template-columns: repeat(var(--metric-columns, 6), minmax(0, 1fr)); gap: 12px; }
.metric-card { display: flex; min-width: 0; min-height: 166px; flex-direction: column; padding: 17px 18px 15px; background: #fff; border: 1px solid #e4ebef; border-top: 4px solid var(--metric-color); box-shadow: 0 5px 16px rgba(18,56,77,.04); }
.metric-card-head { display: flex; min-height: 38px; justify-content: space-between; align-items: flex-start; gap: 10px; }
.metric-card h3 { margin: 0; font-size: 14px; line-height: 1.4; text-wrap: pretty; }
.metric-card .owner { flex: 0 0 auto; max-width: 42%; padding: 3px 7px; color: var(--metric-color); background: color-mix(in srgb, var(--metric-color) 8%, white); font-size: 10px; line-height: 1.35; text-align: right; }
.metric-values { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; min-height: 51px; margin: 12px 0 10px; }
.metric-values small { display: block; color: var(--muted); font-size: 10px; }
.metric-values strong { display: block; margin-top: 3px; font-size: 18px; line-height: 1.25; text-wrap: balance; }
.achievement-line { height: 7px; margin-top: auto; background: #e6ecef; overflow: hidden; }
.achievement-line i { display: block; height: 100%; width: var(--achievement); background: var(--metric-color); }
.metric-foot { display: flex; justify-content: space-between; margin-top: 8px; color: var(--muted); font-size: 11px; }
.metric-foot b { color: var(--metric-color); }
.trust-method { display: grid; grid-template-columns: 240px minmax(0, 1fr) 260px; align-items: stretch; margin-top: 12px; background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--brand); box-shadow: 0 5px 16px rgba(18,56,77,.035); }
.trust-method-title { padding: 16px 18px; border-right: 1px solid var(--line); }
.trust-method-title span { display: block; color: var(--brand); font-size: 12px; font-weight: 800; }
.trust-method-title strong { display: block; margin: 4px 0; font-size: 22px; }
.trust-method-title p, .trust-governance { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.55; }
.trust-formula { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.trust-formula div { display: flex; min-width: 0; flex-direction: column; justify-content: center; padding: 13px 14px; border-right: 1px solid var(--line); }
.trust-formula b { color: var(--brand); font-size: 19px; }
.trust-formula span { margin-top: 3px; color: var(--ink); font-size: 11px; line-height: 1.4; }
.trust-governance { display: flex; align-items: center; padding: 15px 17px; background: #f7faf8; }

.overview-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) 370px; align-items: start; gap: 16px; margin-top: 24px; }
.panel { background: #fff; border: 1px solid var(--line); box-shadow: 0 5px 18px rgba(18,56,77,.035); }
.panel-head { display: flex; justify-content: space-between; align-items: center; min-height: 66px; padding: 15px 20px; border-bottom: 1px solid var(--line); }
.panel-head h2 { margin: 0; font-size: 19px; }
.panel-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
.filter-group { display: flex; gap: 5px; }
.filter-group button { border: 1px solid var(--line); background: #fff; color: var(--muted); padding: 7px 10px; font-size: 12px; }
.filter-group button.active { border-color: var(--navy); background: var(--navy); color: #fff; }
.panel-actions { display: flex; align-items: center; gap: 12px; }
.branch-switch { display: flex; padding: 3px; background: #eef3f6; border: 1px solid var(--line); }
.branch-switch button { border: 0; padding: 7px 11px; background: transparent; color: var(--muted); font-size: 12px; }
.branch-switch button b { margin-left: 4px; font-size: 10px; }
.branch-switch button.active { background: #fff; color: var(--navy); box-shadow: 0 2px 7px rgba(18,56,77,.1); font-weight: 800; }

.plan-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.plan-table th { padding: 12px 14px; text-align: left; background: var(--navy); color: #fff; font-size: 12px; line-height: 1.4; }
.plan-table td { padding: 14px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 13px; line-height: 1.45; }
.plan-table tbody tr { cursor: pointer; }
.plan-table tbody tr:hover { background: #f8fafb; }
.plan-table tbody tr:last-child td { border-bottom: 0; }
.plan-table th:nth-child(1) { width: 34%; }
.plan-table th:nth-child(2) { width: 13%; }
.plan-table th:nth-child(3) { width: 18%; }
.plan-table th:nth-child(4) { width: 11%; }
.plan-table th:nth-child(5) { width: 15%; }
.plan-table th:nth-child(6) { width: 9%; }
.department-name { display: inline-flex; align-items: center; gap: 7px; font-weight: 800; }
.department-name i { width: 8px; height: 25px; background: var(--dept-color); }
.work-title { display: block; margin-bottom: 5px; font-size: 14px; font-weight: 800; line-height: 1.4; text-wrap: pretty; }
.work-output { color: var(--muted); font-size: 12px; line-height: 1.5; text-wrap: pretty; }
.work-department { display: inline-block; margin-bottom: 6px; padding: 2px 6px; background: color-mix(in srgb, var(--dept-color) 9%, white); color: var(--dept-color); font-size: 10px; font-weight: 800; }
.progress-cell { display: flex; align-items: center; gap: 8px; }
.mini-progress { flex: 1; height: 6px; background: #e3eaee; }
.mini-progress i { display: block; height: 100%; width: var(--progress); background: var(--progress-color); }
.progress-cell b { min-width: 32px; font-size: 11px; }
.status-tag { display: inline-flex; align-items: center; flex-wrap: nowrap; gap: 6px; padding: 5px 8px; border-radius: 13px; background: var(--status-bg); color: var(--status-color); font-size: 11px; font-weight: 800; white-space: nowrap; word-break: keep-all; }
.status-tag i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.plan-table th:last-child, .plan-table td:last-child { white-space: nowrap; }

.side-stack { display: grid; align-content: start; gap: 16px; }
.collab-list, .alert-list { padding: 0 19px 8px; }
.collab-item, .alert-item { padding: 15px 0; border-bottom: 1px solid var(--line); }
.collab-item:last-child, .alert-item:last-child { border-bottom: 0; }
.collab-item h3, .alert-item h3 { margin: 0 0 6px; font-size: 14px; line-height: 1.4; }
.collab-route { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; }
.collab-route b { color: var(--route-color); }
.collab-item p, .alert-item p { margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
.side-count { padding: 4px 9px; border-radius: 13px; background: #edf3f8; color: var(--blue); font-size: 11px; font-weight: 800; }

.department-hero { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 132px; border-left: 8px solid var(--dept-color); background: #fff; box-shadow: var(--shadow); }
.department-intro { align-self: center; padding: 25px 30px; }
.department-intro p { margin: 0 0 5px; color: var(--dept-color); font-size: 11px; font-weight: 800; letter-spacing: 1.4px; }
.department-intro h2 { margin: 0 0 9px; font-size: 27px; }
.department-intro span { color: var(--muted); line-height: 1.5; }
.department-owner { display: grid; place-content: center; border-left: 1px solid var(--line); background: color-mix(in srgb, var(--dept-color) 6%, white); }
.department-owner small { color: var(--muted); }
.department-owner strong { margin-top: 5px; font-size: 20px; }
.department-main { display: grid; grid-template-columns: minmax(0, 1fr); align-items: start; gap: 16px; margin-top: 24px; }
.department-side { display: grid; align-content: start; gap: 16px; }
.handoff-item { padding: 15px 19px; border-bottom: 1px solid var(--line); }
.handoff-item:last-child { border-bottom: 0; }
.handoff-item small { color: var(--muted); }
.handoff-item h3 { margin: 5px 0; font-size: 14px; line-height: 1.4; text-wrap: pretty; }
.handoff-item p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; text-wrap: pretty; }

.ledger-hero { display: grid; grid-template-columns: minmax(0, 1fr) 460px; min-height: 140px; background: var(--navy); color: #fff; box-shadow: var(--shadow); }
.ledger-hero > div:first-child { align-self: center; padding: 25px 32px; }
.ledger-hero .section-label { color: #78bce4; }
.ledger-hero h2 { margin: 7px 0 8px; font-size: 27px; }
.ledger-hero > div:first-child span { color: #b9cbd5; font-size: 13px; }
.ledger-summary { display: grid; grid-template-columns: repeat(3, 1fr); background: #fff; color: var(--ink); }
.ledger-summary article { display: flex; flex-direction: column; justify-content: center; padding: 20px; border-left: 1px solid var(--line); }
.ledger-summary strong { font-size: 30px; line-height: 1; }
.ledger-summary span { margin-top: 8px; color: var(--muted); font-size: 12px; }
.ledger-summary .good strong { color: var(--green); }
.ledger-summary .attention strong { color: var(--yellow); }
.ledger-panel { margin-top: 24px; overflow: hidden; }
.ledger-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.ledger-table th { padding: 12px 14px; background: var(--navy); color: #fff; font-size: 12px; text-align: left; }
.ledger-table td { padding: 15px 14px; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 1.45; vertical-align: middle; }
.ledger-table tbody tr:last-child td { border-bottom: 0; }
.ledger-table tbody tr:hover { background: #f8fafb; }
.ledger-table th:nth-child(1) { width: 11%; }
.ledger-table th:nth-child(2) { width: 20%; }
.ledger-table th:nth-child(3) { width: 15%; }
.ledger-table th:nth-child(4) { width: 18%; }
.ledger-table th:nth-child(5) { width: 12%; }
.ledger-table th:nth-child(6) { width: 24%; }
.ledger-table td > b, .ledger-table td > small { display: block; }
.ledger-table td > small { margin-top: 4px; color: var(--muted); }
.evidence-tag { display: inline-block; padding: 5px 8px; border: 1px solid #cfe0ea; background: #f5f9fb; color: var(--navy); font-size: 11px; font-weight: 700; }
.global-hero { display: grid; grid-template-columns: minmax(0, 1fr) 600px; min-height: 142px; background: #0f4664; color: #fff; box-shadow: var(--shadow); }
.global-hero > div:first-child { align-self: center; padding: 25px 32px; }
.global-hero .section-label { color: #8ed0f2; }
.global-hero h2 { margin: 7px 0 8px; font-size: 27px; }
.global-hero > div:first-child span { display: block; max-width: 760px; color: #c3d8e4; font-size: 13px; line-height: 1.55; }
.global-summary { display: grid; grid-template-columns: repeat(4, 1fr); background: #fff; color: var(--ink); }
.global-summary article { display: flex; flex-direction: column; justify-content: center; padding: 18px; border-left: 1px solid var(--line); }
.global-summary strong { font-size: 28px; line-height: 1; }
.global-summary span { margin-top: 8px; color: var(--muted); font-size: 11px; line-height: 1.4; }
.global-summary .good strong { color: var(--green); }
.global-summary .attention strong { color: var(--yellow); }
.global-metric-panel { margin-top: 24px; overflow: hidden; }
.global-filter { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; }
.global-filter select { min-width: 150px; padding: 8px 10px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
.global-metric-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.global-metric-table th { padding: 12px 13px; background: var(--navy); color: #fff; font-size: 12px; text-align: left; }
.global-metric-table td { padding: 13px; border-bottom: 1px solid var(--line); font-size: 12px; line-height: 1.45; vertical-align: middle; }
.global-metric-table tbody tr:last-child td { border-bottom: 0; }
.global-metric-table tbody tr:hover { background: #f8fafb; }
.global-metric-table th:nth-child(1) { width: 11%; }
.global-metric-table th:nth-child(2) { width: 19%; }
.global-metric-table th:nth-child(3) { width: 15%; }
.global-metric-table th:nth-child(4) { width: 16%; }
.global-metric-table th:nth-child(5) { width: 16%; }
.global-metric-table th:nth-child(6) { width: 15%; }
.global-metric-table th:nth-child(7) { width: 8%; }
.global-metric-table td > b, .global-metric-table td > small { display: block; }
.global-metric-table td > small { margin-top: 4px; color: var(--muted); }
.department-ledger-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.department-ledger-table th { padding: 12px 14px; background: var(--navy); color: #fff; font-size: 12px; line-height: 1.4; text-align: left; }
.department-ledger-table td { padding: 15px 14px; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 1.45; vertical-align: middle; }
.department-ledger-table tbody tr:last-child td { border-bottom: 0; }
.department-ledger-table th:nth-child(1) { width: 23%; }
.department-ledger-table th:nth-child(2) { width: 17%; }
.department-ledger-table th:nth-child(3) { width: 20%; }
.department-ledger-table th:nth-child(4) { width: 15%; }
.department-ledger-table th:nth-child(5) { width: 25%; }
.department-ledger-table td > b, .department-ledger-table td > small { display: block; }
.department-ledger-table td > small { margin-top: 4px; color: var(--muted); }
.empty-ledger { display: grid; min-height: 150px; place-content: center; gap: 6px; text-align: center; }
.empty-ledger span { color: var(--muted); font-size: 12px; }

.modal-backdrop { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; padding: 30px; background: rgba(9,31,43,.48); }
.modal-backdrop.open { display: grid; }
.modal-card { width: min(760px, 94vw); max-height: 90vh; overflow: auto; background: #fff; box-shadow: 0 30px 90px rgba(0,0,0,.27); }
.modal-card header { display: flex; justify-content: space-between; align-items: center; padding: 21px 25px; border-bottom: 1px solid var(--line); }
.modal-card header small { color: var(--muted); }
.modal-card header h2 { margin: 4px 0 0; }
.modal-card header button { border: 0; background: transparent; color: var(--muted); font-size: 25px; }
.modal-body { padding: 24px 25px; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
.detail-box { padding: 14px; background: var(--soft); }
.detail-box small { color: var(--muted); }
.detail-box strong { display: block; margin-top: 5px; line-height: 1.4; }
.detail-section { padding-top: 17px; border-top: 1px solid var(--line); }
.detail-section h3 { margin: 0 0 8px; font-size: 15px; }
.detail-section p { margin: 0; color: var(--muted); line-height: 1.6; }
.toast { position: fixed; right: 28px; bottom: 28px; z-index: 50; opacity: 0; transform: translateY(16px); padding: 13px 18px; background: var(--navy); color: #fff; box-shadow: var(--shadow); pointer-events: none; transition: .2s; }
.toast.show { opacity: 1; transform: translateY(0); }

@media (max-width: 1350px) {
  .app-header { height: auto; min-height: 92px; flex-wrap: wrap; gap: 12px; padding-block: 12px; }
  .app-header, .department-tabs { padding-inline: 24px; }
  .brand-copy { min-width: 260px; }
  .period-selector { min-width: 260px; }
  .header-actions { flex-wrap: wrap; justify-content: flex-end; }
  #dashboardRoot { padding-inline: 24px; }
  .metric-grid { grid-template-columns: repeat(3, 1fr); }
  .overview-grid, .department-main { grid-template-columns: 1fr; }
  .side-stack, .department-side { grid-template-columns: 1fr 1fr; }
  .ledger-hero { grid-template-columns: 1fr 390px; }
  .global-hero { grid-template-columns: 1fr 480px; }
  .trust-method { grid-template-columns: 220px minmax(0, 1fr); }
  .trust-governance { grid-column: 1 / -1; border-top: 1px solid var(--line); }
}

@media (max-width: 900px) {
  .app-header { height: auto; padding-block: 15px; align-items: flex-start; gap: 20px; }
  .header-actions { flex-wrap: wrap; justify-content: flex-end; }
  .brand-copy { min-width: 0; }
  .overview-hero { grid-template-columns: 1fr; }
  .overall-score { padding: 20px; border-right: 0; border-bottom: 1px solid rgba(255,255,255,.17); }
  .trust-method { grid-template-columns: 1fr; }
  .trust-method-title, .trust-formula, .trust-governance { grid-column: 1; }
  .trust-method-title { border-right: 0; border-bottom: 1px solid var(--line); }
  .trust-formula { grid-template-columns: repeat(2, 1fr); }
  .metric-grid { grid-template-columns: repeat(2, 1fr); }
  .plan-table { min-width: 950px; }
  .panel:has(.plan-table) { overflow-x: auto; }
  .side-stack, .department-side { grid-template-columns: 1fr; }
  .department-hero { grid-template-columns: 1fr; }
  .department-owner { padding: 18px; border-left: 0; border-top: 1px solid var(--line); }
  .ledger-hero { grid-template-columns: 1fr; }
  .ledger-summary { grid-template-columns: repeat(3, 1fr); }
  .global-hero { grid-template-columns: 1fr; }
  .global-summary { grid-template-columns: repeat(4, 1fr); }
  .ledger-panel { overflow-x: auto; }

.governance-line, .due-line, .detail-entry { display: block; margin-top: 5px; color: #8b909a; font-size: 8px; }
.row-status { display: inline-flex; vertical-align: middle; }
.primary-owner { display: block; color: #303540; font-size: 10px; }
.weekly-output { color: #555c68; font-size: 10px; }
.management-note { display: grid; grid-template-columns: 150px minmax(0, 1fr); padding: 14px 19px; align-items: start; gap: 18px; background: #fbf8ee; border-top: 1px solid #eee7ce; }
.management-note > strong { color: #6f5a16; font-size: 10px; }
.management-note > div { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.management-note p { display: grid; grid-template-columns: 24px minmax(0, 1fr); margin: 0; gap: 8px; }
.management-note p > b { color: #b08214; font-size: 9px; }
.management-note p span { color: #77705c; font-size: 9px; line-height: 1.45; }
.management-note p strong { display: block; margin-bottom: 2px; color: #474236; font-size: 10px; }

.compact-metric-section .metric-card { min-height: 136px; padding: 13px 14px 12px; }
.compact-metric-section .metric-values { margin: 9px 0 7px; }
.compact-metric-section .metric-values strong { font-size: 15px; }
.section-actions { display: flex; align-items: center; gap: 14px; }
.text-route { padding: 0; border: 0; background: transparent; color: var(--brand-primary); font-size: 10px; font-weight: 700; }
.overview-entry { display: grid; grid-template-columns: minmax(280px, 1fr) auto auto; margin-top: 26px; padding: 21px 22px; align-items: center; gap: 25px; }
.overview-entry h2 { margin: 3px 0 5px; font-size: 17px; }
.overview-entry p { color: var(--muted); font-size: 10px; }
.overview-entry-stats { display: flex; gap: 8px; }
.overview-entry-stats span { display: flex; min-width: 80px; padding: 9px 11px; flex-direction: column; border-radius: 10px; background: #f6f7fa; color: #737985; font-size: 8px; }
.overview-entry-stats b { color: #252936; font-size: 18px; }
.primary-route { min-height: 38px; padding: 0 15px; border: 0; border-radius: 8px; background: var(--brand-primary); color: #fff; font-size: 10px; font-weight: 700; }

.leadership-department-hero { grid-template-columns: minmax(0, 1fr) 270px; min-height: 164px; }
.leadership-department-hero .department-intro { display: flex; padding: 25px 30px; justify-content: center; flex-direction: column; }
.leadership-department-hero .department-intro h2 { margin: 8px 0 5px; font-size: 25px; letter-spacing: -.35px; }
.leadership-department-hero .department-intro > p { max-width: 820px; color: #6e737c; font-size: 10px; line-height: 1.6; }
.leadership-department-hero .department-kicker span { color: var(--dept-color); }
.leadership-department-hero .department-kicker b { background: color-mix(in srgb, var(--dept-color) 9%, white); color: var(--dept-color); }
.leadership-department-hero .department-owner { display: flex; padding: 25px 28px; justify-content: center; align-items: flex-start; flex-direction: column; border-left: 1px solid #e8e9ed; }
.leadership-department-hero .department-owner > small { color: #858a93; font-size: 9px; }
.leadership-department-hero .department-owner > strong { margin: 4px 0 16px; color: #2d3139; font-size: 15px; }
.leadership-department-hero .department-owner > div { display: flex; width: 100%; padding-top: 12px; justify-content: space-between; align-items: end; border-top: 1px solid #e2e5e8; }
.leadership-department-hero .department-owner span { color: #777d86; font-size: 9px; }
.leadership-department-hero .department-owner b { color: var(--dept-color); font-size: 24px; }
.department-briefing-panel { margin-top: 18px; }
.department-briefing-panel .weekly-briefing-table th:nth-child(1) { width: 34%; }
.department-briefing-panel .weekly-briefing-table th:nth-child(2) { width: 34%; }
.department-briefing-panel .weekly-briefing-table th:nth-child(3) { width: 14%; }
.department-briefing-panel .weekly-briefing-table th:nth-child(4) { width: 18%; }
.department-metric-section { margin-top: 25px; }

.department-plan-section { margin-top: 28px; }
.department-plan-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 11px; }
.department-plan-card { min-height: 170px; padding: 15px 16px; border: 1px solid var(--line); border-top: 3px solid var(--dept-color); border-radius: 12px; background: #fff; }
.department-plan-card > div:first-child { display: flex; justify-content: space-between; align-items: center; }
.department-plan-card > div:first-child > span { color: var(--dept-color); font-size: 9px; font-weight: 750; }
.department-plan-card h3 { margin: 13px 0 5px; color: #282c34; font-size: 13px; }
.department-plan-card p { min-height: 32px; color: #6f7580; font-size: 10px; line-height: 1.55; }
.department-plan-card > small { display: block; margin: 11px 0; color: #858b95; font-size: 9px; }
.department-plan-card .progress-cell { max-width: 200px; }

.department-panorama-panel, .portfolio-panel { margin-top: 28px; }
.department-package-list { padding: 8px 18px 18px; }
.package-list { display: grid; gap: 7px; }
.package-item { overflow: hidden; border: 1px solid #e4e6eb; border-radius: 9px; background: #fff; }
.package-toggle { display: grid; width: 100%; min-height: 50px; padding: 10px 12px; grid-template-columns: 14px minmax(0, 1fr) 50px 46px; align-items: center; gap: 8px; border: 0; background: transparent; color: #3c414a; text-align: left; }
.package-toggle:hover { background: #fafbfc; }
.package-chevron { color: var(--dept-color); font-size: 18px; line-height: 1; transition: transform .18s ease; }
.package-item.open .package-chevron { transform: rotate(90deg); }
.package-copy b, .package-copy span { display: block; }
.package-copy b { color: #343944; font-size: 10px; }
.package-copy span { margin-top: 3px; overflow: hidden; color: #858a93; font-size: 8px; text-overflow: ellipsis; white-space: nowrap; }
.package-count { color: #8a909a; font-size: 8px; text-align: right; }
.package-progress { color: var(--dept-color); font-size: 10px; font-weight: 750; text-align: right; }
.package-detail { display: none; padding: 0 12px 10px 34px; background: #fbfcfd; border-top: 1px solid #eceef2; }
.package-item.open .package-detail { display: block; }
.task-line { display: grid; padding: 9px 0; grid-template-columns: minmax(180px, 2fr) 1fr 80px 115px minmax(120px, 1.2fr); align-items: center; gap: 10px; border-bottom: 1px dashed #e3e5e9; color: #666d78; font-size: 8px; }
.task-line:last-child { border-bottom: 0; }
.task-line > b { color: #3f454f; font-size: 9px; }
.task-line > small { color: #8b919b; }
.task-line > div { display: flex; align-items: center; gap: 6px; }
.micro-progress { width: 72px; height: 4px; overflow: hidden; border-radius: 999px; background: #e9ebef; }
.micro-progress i { display: block; height: 100%; border-radius: inherit; background: var(--dept-color); }

.work-overview-hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; padding: 27px 30px; align-items: center; gap: 30px; border: 1px solid var(--line); border-radius: 14px; background: linear-gradient(135deg, #fff 0%, #f5f7ff 100%); }
.work-overview-hero h2 { margin: 5px 0 7px; font-size: 24px; }
.work-overview-hero p { color: #6d7380; font-size: 10px; }
.work-overview-stats { display: grid; grid-template-columns: repeat(4, 92px); gap: 8px; }
.work-overview-stats article { display: flex; min-height: 78px; padding: 12px; justify-content: center; flex-direction: column; border: 1px solid #e4e6ee; border-radius: 10px; background: rgba(255,255,255,.82); }
.work-overview-stats strong { color: #2d3442; font-size: 24px; }
.work-overview-stats span { color: #777e8a; font-size: 8px; }
.portfolio-header, .portfolio-row { display: grid; grid-template-columns: minmax(260px, 1fr) 230px minmax(500px, 1.9fr); }
.portfolio-header { padding: 9px 18px; background: #f7f8fa; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); color: #7a808b; font-size: 8px; font-weight: 700; }
.portfolio-header > div, .portfolio-cell { padding: 0 11px; }
.portfolio-row { border-bottom: 1px solid #e9ebef; }
.portfolio-row:last-child { border-bottom: 0; }
.portfolio-cell { padding-top: 14px; padding-bottom: 14px; border-right: 1px solid #edf0f3; }
.portfolio-cell:last-child { border-right: 0; }
.portfolio-dept { display: flex; gap: 11px; }
.portfolio-index { display: grid; width: 29px; height: 29px; flex: 0 0 auto; place-items: center; border-radius: 8px; background: color-mix(in srgb, var(--dept-color) 10%, white); color: var(--dept-color); font-size: 9px; font-weight: 800; }
.portfolio-dept h3 { margin: 0 0 4px; color: #30353e; font-size: 12px; }
.portfolio-dept p { margin: 0 0 7px; color: #777e88; font-size: 8px; line-height: 1.45; }
.portfolio-dept small { padding: 3px 6px; border-radius: 999px; background: #f2f3f5; color: #737984; font-size: 7px; }
.portfolio-owner strong { color: #3c424c; font-size: 10px; }
.count-pills { display: flex; margin-top: 9px; flex-wrap: wrap; gap: 5px; }
.count-pills span { padding: 3px 6px; border-radius: 999px; background: #f5f6f8; color: #7a808b; font-size: 7px; }

@media (max-width: 1050px) {
  .management-note { grid-template-columns: 1fr; }
  .overview-entry { grid-template-columns: 1fr; }
  .overview-entry-stats { flex-wrap: wrap; }
  .department-plan-grid { grid-template-columns: 1fr 1fr; }
  .work-overview-hero { grid-template-columns: 1fr; }
  .portfolio-panel { overflow-x: auto; }
  .portfolio-header, .portfolio-row { min-width: 1080px; }
}
@media (max-width: 700px) {
  .leadership-hero, .leadership-department-hero { grid-template-columns: 1fr; }
  .leadership-hero .overall-score { min-height: 120px; }
  .management-note > div { grid-template-columns: 1fr; }
  .section-actions { align-items: flex-start; flex-direction: column; gap: 5px; }
  .department-plan-grid { grid-template-columns: 1fr; }
  .leadership-department-hero .department-owner { border-top: 1px solid #e8e9ed; border-left: 0; }
  .work-overview-stats { grid-template-columns: 1fr 1fr; }
}
@media print {
  .weekly-briefing-table { min-width: 0; }
  .primary-route, .text-route { display: none; }
}
  </style>

  if (value >= 40) return '#e8a522';

function planRows(plans, includeDepartment = true) {
  const filtered = plans.filter(plan => dashboardState.planFilter === 'all' || plan[6] === dashboardState.planFilter);
  return filtered.map((plan, index) => {
    const department = departments[plan[0]] || departments[dashboardState.tab];
    // Every plan record keeps its department id in position 0. Department
    // pages hide the department column but retain the same data structure.
    const offset = 1;
    const title = plan[offset];
    const output = plan[offset + 1];
    const owner = plan[offset + 2];
    const due = plan[offset + 3];
    const progress = plan[offset + 4];
    const status = plan[offset + 5];
    const collaborators = plan[offset + 6];
    return `<tr data-plan-index="${index}" data-plan-source="${includeDepartment ? 'overall' : dashboardState.tab}">
      <td>${includeDepartment ? `<span class="work-department" style="--dept-color:${department.color}">${department.short}</span>` : ''}<span class="work-title">${title}</span><span class="work-output">产出：${output}</span></td>

function departmentPackages(id) {
  const department = departments[id];
  const taskPhases = [
    ['范围与标准确认', 20, '牵头部门'],
    ['核心执行与协同', 0, '第一负责人'],
    ['交付验收与复盘', -20, '部门分析师／PMO'],
  ];
  const packages = department.plans.map(plan => ({
    title: plan[0], summary: plan[1], owner: plan[2], progress: plan[4], status: plan[5],
    tasks: taskPhases.map((phase, index) => ({
      title: `${plan[0]}：${index === 0 ? phase[0] : index === 1 ? plan[1] : phase[0]}`,
      owner: index === 1 ? plan[2] : phase[2], due: index === 2 ? plan[3] : index === 1 ? '执行中' : '已确认',
      progress: Math.max(10, Math.min(100, plan[4] + phase[1])), collaborator: index === 1 ? plan[6] : index === 0 ? plan[6].split('、').slice(0, 2).join('、') : '数据分析师、PMO',
    })),
  }));
  packages.push({
    title: '跨部门协同与效果闭环', summary: department.handoffs.map(item => item[1]).join('；'), owner: department.owner, progress: 50, status: 'attention',
    tasks: department.handoffs.map((item, index) => ({ title: `${item[0]}：${item[1]}`, owner: index === 0 ? department.owner : '项目接口人', due: '持续推进', progress: 35 + index * 15, collaborator: item[2] })),
  });
  return packages;
}

function packageMarkup(pkg, id, index) {
  const key = `${id}-${index}`;
  const open = dashboardState.openPackages.includes(key);
  return `<article class="package-item ${open ? 'open' : ''}" style="--dept-color:${departments[id].color}"><button type="button" class="package-toggle" data-package-key="${key}" aria-expanded="${open}"><span class="package-chevron">›</span><span class="package-copy"><b>${pkg.title}</b><span>${pkg.summary}</span></span><span class="package-count">${pkg.tasks.length}项</span><span class="package-progress">${pkg.progress}%</span></button><div class="package-detail">${pkg.tasks.map(task => `<div class="task-line"><b>${task.title}</b><span>${task.owner}</span><small>${task.due}</small><div><div class="micro-progress"><i style="width:${task.progress}%"></i></div><small>${task.progress}%</small></div><small>${task.collaborator}</small></div>`).join('')}</div></article>`;
}

function allPackageStats() {
  const packages = Object.keys(departments).flatMap(id => departmentPackages(id));
  const tasks = packages.flatMap(pkg => pkg.tasks);
  return { packages: packages.length, tasks: tasks.length, attention: packages.filter(pkg => pkg.status === 'attention' || pkg.status === 'delayed').length };
}

    <div class="panel-head"><div><p class="section-label">WEEKLY REPORT DIRECTORY</p><h2>本周汇报目录</h2><p>PMO 按老板当周需要关注的事项安排汇报顺序</p></div><div class="briefing-summary"><span>${weeklyAgenda.length}个部门</span><span>${attentionCount}项需关注</span></div></div>
    ${weeklyBriefingTable(weeklyAgenda, true)}
    <div class="management-note"><strong>老板本周重点</strong><div>${alerts.map((alert, index) => `<p><b>0${index + 1}</b><span><strong>${alert[0]}</strong>${alert[1].replace('示例：', '')}</span></p>`).join('')}</div></div>
  </section>
  <section class="metric-section compact-metric-section"><div class="section-head"><div><p class="section-label">SELECTED METRICS</p><h2 class="section-title">本周关键数据</h2></div><div class="section-actions"><p class="section-note">只放老板需要判断的目标、当前值和周变化</p><button type="button" class="text-route" data-route-tab="global">查看全部治理数据 →</button></div></div><div class="metric-grid" style="--metric-columns:${overallMetrics.length}">${metricCards(overallMetrics)}</div></section>
  <section class="panel overview-entry"><div><p class="section-label">LOW-FREQUENCY OVERVIEW</p><h2>完整工作全景</h2><p>第一次介绍整体工作，或组织与工作结构变化时再看；不占用每周汇报首页。</p></div><div class="overview-entry-stats"><span><b>8</b>实际部门</span><span><b>${stats.packages}</b>工作包</span><span><b>${stats.tasks}</b>具体任务</span></div><button type="button" class="primary-route" data-route-tab="ledger">进入工作总览 →</button></section>`;
}

function completedWorkTable(items, includeDepartment = false) {
  if (!items.length) return `<div class="empty-ledger"><strong>暂无已完成事项</strong><span>工作完成后，将自动进入该部门历史台账。</span></div>`;
  return `<table class="plan-table completed-plan-table"><thead><tr><th>工作与产出</th><th>负责人</th><th>协作部门</th><th>完成时间</th><th>完成进度</th><th>状态</th></tr></thead><tbody>${items.map(item => { const department = departments[item[0]]; const verification = item[5] === 'verified' ? 100 : 70; return `<tr><td>${includeDepartment ? `<span class="work-department" style="--dept-color:${department.color}">${department.short}</span>` : ''}<span class="work-title">${item[1]}</span><span class="work-output">证据：${item[4]}；${item[6]}</span></td><td>${item[2]}</td><td>${item[7]}</td><td>${item[3]}</td><td><div class="progress-cell"><span class="mini-progress"><i style="--progress:${verification}%;--progress-color:${progressColor(verification)}"></i></span><b>${verification}%</b></div></td><td>${ledgerTag(item[5])}</td></tr>`; }).join('')}</tbody></table>`;
}

function completedDepartmentTable(items) {
  if (!items.length) return `<div class="empty-ledger"><strong>暂无已完成事项</strong><span>事项完成后将在这里保留交付证据与验证状态。</span></div>`;
  return `<div class="weekly-table-scroll"><table class="weekly-briefing-table completed-briefing-table"><thead><tr><th>已完成事项</th><th>交付证据</th><th>完成时间</th><th>第一负责人</th></tr></thead><tbody>${items.map(item => `<tr><td><span class="work-title">${item[1]}</span><span class="row-status">${ledgerTag(item[5])}</span></td><td><span class="weekly-output">${item[4]}</span></td><td><strong>${item[3]}</strong><small class="due-line">${item[6]}</small></td><td><strong class="primary-owner">${item[2]}</strong></td></tr>`).join('')}</tbody></table></div>`;
}

function renderDepartment(id) {
  const d = departments[id];
  const plans = d.plans.map(plan => [id, ...plan]);
  const completedItems = completedLedger.filter(item => item[0] === id);
  const completedCount = completedItems.length;
  const showingCompleted = dashboardState.departmentWorkView === 'completed';
  const period = currentReportingPeriod();
  const average = Math.round(plans.reduce((sum, plan) => sum + plan[5], 0) / plans.length);
  const group = governanceGroups[id];
  const metricSelection = d.metrics.slice(0, 4).map((metric, index) => [metric[0], metric[4], metric[1], metric[2], metric[3], d.color, `较上周 ${index % 2 === 0 ? '+' : '-'}${index + 1}pp`]);
  return `<section class="department-hero leadership-department-hero" style="--dept-color:${d.color}"><div class="department-intro"><div class="department-kicker"><span>${group.label}</span><b>治理汇报第${period.reportWeek}周</b></div><h2>${d.label}周报</h2><p>${d.purpose}</p><div class="report-meta"><span>${period.shortRange}</span><span>页面更新 · 2026年8月7日</span></div></div><div class="department-owner"><small>第一负责人</small><strong>${d.owner}</strong><div><span>整体进度</span><b>${average}%</b></div></div></section>
    <section class="panel weekly-briefing-panel department-briefing-panel"><div class="panel-head"><div><p class="section-label">WEEKLY DEPARTMENT REPORT</p><h2>${showingCompleted ? '已完成工作' : '本周汇报'}</h2><p>${showingCompleted ? '保留交付证据与验证结果' : '先讲事项、产出、进度和第一负责人；协作方与细节点击查看'}</p></div><div class="branch-switch"><button class="${showingCompleted ? '' : 'active'}" data-work-view="active">本周 <b>${plans.length}</b></button><button class="${showingCompleted ? 'active' : ''}" data-work-view="completed">已完成 <b>${completedCount}</b></button></div></div>${showingCompleted ? completedDepartmentTable(completedItems) : weeklyBriefingTable(plans, false)}</section>
    <section class="metric-section compact-metric-section department-metric-section"><div class="section-head"><div><p class="section-label">DEPARTMENT DATA</p><h2 class="section-title">部门拆解数据</h2></div><p class="section-note">本周只展示 4 个核心指标：目标、当前值、周变化</p></div><div class="metric-grid" style="--metric-columns:${metricSelection.length}">${metricCards(metricSelection, d.color)}</div></section>
    ${renderDepartmentPlan(id)}
    ${renderDepartmentPanorama(id)}`;
}

function renderDashboard() {
  const root = document.querySelector('#dashboardRoot');
  root.innerHTML = dashboardState.tab === 'overall' ? renderOverview() : dashboardState.tab === 'ledger' ? renderWorkOverview() : dashboardState.tab === 'global' ? renderGlobalMetrics() : renderDepartment(dashboardState.tab);
  bindDynamicEvents();
}

function bindDynamicEvents() {
  document.querySelectorAll('[data-filter]').forEach(button => button.addEventListener('click', () => {
    dashboardState.planFilter = button.dataset.filter;
    if (dashboardState.tab === 'overall') dashboardState.overallWorkView = 'active';
    else if (departments[dashboardState.tab]) dashboardState.departmentWorkView = 'active';
    renderDashboard();
  }));
  document.querySelectorAll('[data-ledger-filter]').forEach(button => button.addEventListener('click', () => {
    dashboardState.ledgerFilter = button.dataset.ledgerFilter;
    renderDashboard();
  }));
  document.querySelectorAll('[data-work-view]').forEach(button => button.addEventListener('click', () => {
    dashboardState.departmentWorkView = button.dataset.workView;
    dashboardState.planFilter = 'all';
    renderDashboard();
  }));
  document.querySelectorAll('[data-overall-work-view]').forEach(button => button.addEventListener('click', () => {
    dashboardState.overallWorkView = button.dataset.overallWorkView;
    dashboardState.planFilter = 'all';
    renderDashboard();
  }));
  const globalMetricDepartment = document.querySelector('#globalMetricDepartment');
  if (globalMetricDepartment) globalMetricDepartment.addEventListener('change', event => {
    dashboardState.globalMetricDepartment = event.target.value;
    renderDashboard();
  });
  document.querySelectorAll('[data-jump-department]').forEach(button => button.addEventListener('click', event => {
    event.stopPropagation();
    switchDashboardTab(button.dataset.jumpDepartment);
  }));
  document.querySelectorAll('[data-route-tab]').forEach(button => button.addEventListener('click', () => switchDashboardTab(button.dataset.routeTab)));
  document.querySelectorAll('[data-package-key]').forEach(button => button.addEventListener('click', () => {
    const key = button.dataset.packageKey;
    dashboardState.openPackages = dashboardState.openPackages.includes(key) ? dashboardState.openPackages.filter(item => item !== key) : [...dashboardState.openPackages, key];
    renderDashboard();
  }));
  document.querySelectorAll('[data-plan-index]').forEach(row => row.addEventListener('click', () => openPlan(row.dataset.planSource, Number(row.dataset.planIndex))));
}

function openPlan(source, filteredIndex) {
  const sourcePlans = source === 'agenda' ? weeklyAgenda : source === 'overall' ? overallPlans : departments[source].plans.map(plan => [source, ...plan]);
  const visiblePlans = source === 'agenda' ? sourcePlans : sourcePlans.filter(plan => dashboardState.planFilter === 'all' || plan[6] === dashboardState.planFilter);
  const plan = visiblePlans[filteredIndex];
  if (!plan) return;
  const d = departments[plan[0]];
  const title = plan[1], output = plan[2], owner = plan[3], due = plan[4], progress = plan[5], status = plan[6], collaborators = plan[7];
  document.querySelector('#modalDepartment').textContent = d.label;
  document.querySelector('#modalTitle').textContent = title;
  document.querySelector('#modalBody').innerHTML = `<div class="detail-grid"><div class="detail-box"><small>负责人</small><strong>${owner}</strong></div><div class="detail-box"><small>完成时间</small><strong>${due}</strong></div><div class="detail-box"><small>当前进度</small><strong>${progress}% · ${statusMap[status].label}</strong></div><div class="detail-box"><small>协作部门</small><strong>${collaborators}</strong></div></div><section class="detail-section"><h3>明确产出</h3><p>${output}</p></section><section class="detail-section"><h3>下一步和验证</h3><p>责任部门补充下一步动作、完成证据和验证指标；由部门分析师验证效果，数据治理／PMO确认口径与关闭状态。</p></section>`;
  document.querySelector('#planModal').classList.add('open');
}

function showToast(message) {
  const toast = document.querySelector('#toast');
  toast.textContent = message; toast.classList.add('show');
  clearTimeout(showToast.timer); showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
}

function updatePeriodSelector() {
  const select = document.querySelector('#periodSelect');
  const label = document.querySelector('#periodSelectLabel');
  label.textContent = '选择汇报期';
  select.innerHTML = weekPeriods.map(period => `<option value="${period.value}" ${period.value === dashboardState.selectedWeek ? 'selected' : ''}>${period.current ? '当前 · ' : ''}${period.optionLabel}</option>`).join('');
  const selected = currentReportingPeriod();
  document.querySelector('#dataPeriod').textContent = selected.label;
}

function init() {
  renderTabs(); updatePeriodSelector(); renderDashboard();
  document.querySelectorAll('[data-period]').forEach(button => button.addEventListener('click', () => {
    dashboardState.period = button.dataset.period;
    document.querySelectorAll('[data-period]').forEach(item => item.classList.toggle('active', item === button));
    updatePeriodSelector();
    renderDashboard();
  }));
  document.querySelector('#periodSelect').addEventListener('change', event => {
    dashboardState.selectedWeek = event.target.value;
    updatePeriodSelector();
    renderDashboard();
  });
  document.querySelector('#closeModal').addEventListener('click', () => document.querySelector('#planModal').classList.remove('open'));
  document.querySelector('#planModal').addEventListener('click', event => { if (event.target.id === 'planModal') event.currentTarget.classList.remove('open'); });
  document.querySelector('#exportDashboard').addEventListener('click', () => { showToast('已进入打印／导出模式'); setTimeout(() => window.print(), 300); });
}

init();

</script>
</body>
</html>
